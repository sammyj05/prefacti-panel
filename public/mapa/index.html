<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ED Intelligence — Panama Residential Portfolio</title>
<link rel="stylesheet" href="./node_modules/maplibre-gl/dist/maplibre-gl.css">
<script>
  if(location.protocol==='file:') location.replace('http://127.0.0.1:4173/');
</script>
<style>
  /* ---- tokens: light is the base, dark is selected (not flipped) ---------- */
  :root{
    color-scheme:light;
    --page:#f4f7fb; --surface:#ffffff; --surface-2:#f6f9fd;
    --ink:#080c16; --ink-2:#3a465c; --ink-muted:#64728a;
    --line:#dde5f0; --rule:#c2cddd;
    --ring:rgba(8,12,22,.10); --shadow:0 6px 28px rgba(8,12,22,.14);
    /* Sequential money ramp, now in value rather than hue. The panel around
       this viewer went monochrome; a blue ramp inside a black-and-white
       product reads as a screenshot of something else. Five steps of grey
       still order correctly — that was the ramp's only job — and the reserved
       accent below is the one thing that stays coloured. */
    --m1:#bfdcf4; --m2:#8cc0e9; --m3:#4b96d4; --m4:#1c6eeb; --m5:#0e2647;
    /* Categorical (unit status). Sold and available separate by value; the
       reserved slot keeps the one accent the whole product allows, because a
       stack plan has to show what is held without being read. */
    --sold:#0e2647; --resv:#d62839; --avail:#cfe0ef;
    --good:#1056c8;
    --ctx-lo:#e4eaf3; --ctx-hi:#ccd6e4;      /* recessive context buildings */
    --beacon:#1c6eeb;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --page:#090c14; --surface:#111622; --surface-2:#0d111b;
    --ink:#f4f8fd; --ink-2:#b4c0d1; --ink-muted:#8896aa;
    --line:#1e2536; --rule:#2c3448;
    --ring:rgba(255,255,255,.10); --shadow:0 6px 30px rgba(0,0,0,.55);
    --m1:#234066; --m2:#2f5c90; --m3:#3d7cbc; --m4:#86bdea; --m5:#c8e3f7;
    --sold:#c8e3f7; --resv:#f06e78; --avail:#33455e;
    --good:#7aaaf8;
    --ctx-lo:#141a27; --ctx-hi:#222b3c;
    --beacon:#c8e3f7;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--page); color:var(--ink);
    font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  button,input,select{font:inherit; color:inherit}

  /* ---- shell: map is the page; everything else floats over it ------------ */
  .app{position:fixed; inset:0; display:flex; flex-direction:column}
  #map{position:absolute; inset:0; z-index:0; background:var(--surface-2)}

  /* ---- toolbar: one filter row above everything it scopes ---------------- */
  .bar{
    position:relative; z-index:30; display:flex; align-items:center; gap:10px; row-gap:8px;
    flex-wrap:wrap; padding:9px 14px; background:color-mix(in srgb,var(--surface) 78%,transparent);
    backdrop-filter:blur(22px) saturate(150%); border-bottom:1px solid var(--line);
  }
  .ctl{white-space:nowrap}
  .brand{display:flex; align-items:center; gap:9px; margin-right:2px}
  .mark{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;
        background:var(--m5);color:var(--surface);font-weight:700;font-size:12px;letter-spacing:-.04em}
  :root[data-theme="dark"] .mark{color:#0d0f10}
  .brand h1{font-size:13px;margin:0;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
  .brand small{display:block;color:var(--ink-muted);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase}
  .spacer{flex:1}
  .ctl{height:32px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2);
       padding:0 10px; font-size:12px; cursor:pointer; outline:0; transition:border-color .15s}
  .ctl:hover{border-color:var(--rule)}
  .ctl:focus-visible{border-color:var(--m3); box-shadow:0 0 0 3px color-mix(in srgb,var(--m3) 24%,transparent)}
  select.ctl{padding-right:26px}
  .lens-wrap{display:flex; align-items:center; gap:7px}
  .lens-wrap label{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-muted)}

  /* ---- search ------------------------------------------------------------ */
  .search{position:relative; width:min(250px,24vw)}
  .search input{width:100%; height:32px; border:1px solid var(--line); border-radius:8px;
    background:var(--surface-2); padding:0 30px 0 30px; font-size:12px; outline:0}
  .search input:focus{border-color:var(--m3); box-shadow:0 0 0 3px color-mix(in srgb,var(--m3) 24%,transparent)}
  .search .icon{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--ink-muted); pointer-events:none; font-size:12px}
  .search .clear{position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:transparent;
    color:var(--ink-muted); cursor:pointer; padding:4px 6px; border-radius:6px; display:none}
  .search .clear:hover{background:var(--line); color:var(--ink)}
  .results{position:absolute; top:38px; left:0; right:0; background:var(--surface); border:1px solid var(--line);
    border-radius:10px; box-shadow:var(--shadow); overflow:hidden; display:none; max-height:60vh; overflow-y:auto}
  .results.open{display:block}
  .results li{list-style:none; display:flex; align-items:center; gap:9px; padding:8px 11px; cursor:pointer; border-bottom:1px solid var(--line)}
  .results li:last-child{border-bottom:0}
  .results li:hover,.results li.active{background:var(--surface-2)}
  .results ul{margin:0;padding:0}
  .results .sw{width:9px;height:20px;border-radius:3px;flex:0 0 auto}
  .results b{font-size:12px;font-weight:600;display:block}
  .results small{color:var(--ink-muted); font-size:10.5px}
  .results .val{margin-left:auto; font-size:11.5px; font-variant-numeric:tabular-nums; color:var(--ink-2)}
  .results .empty{padding:12px; color:var(--ink-muted); font-size:12px}
  .results .grouphead{padding:7px 11px 4px; font-size:9.5px; letter-spacing:.11em; text-transform:uppercase;
    color:var(--ink-muted); background:var(--surface-2); border-bottom:1px solid var(--line)}

  /* ---- floating panels --------------------------------------------------- */
  .stage{position:relative; flex:1; min-height:0}
  /* rails keep the panels and the legend in one column, so they can never overlap */
  .rail{position:absolute; z-index:20; top:16px; bottom:16px; display:flex; flex-direction:column;
        gap:10px; justify-content:flex-end; pointer-events:none}
  .rail > *{pointer-events:auto}
  .rail-left{left:16px; width:292px}
  .rail-right{right:16px; width:324px}
  .panel{
    min-height:0; display:flex; flex-direction:column; overflow:hidden;
    background:color-mix(in srgb,var(--surface) 82%,transparent);
    backdrop-filter:blur(26px) saturate(150%);
    border:1px solid var(--ring); border-radius:13px; box-shadow:var(--shadow);
  }
  .rail .panel{flex:1 1 auto}
  .panel.hidden{display:none}
  .phead{display:flex; align-items:center; gap:8px; padding:11px 13px; border-bottom:1px solid var(--line)}
  .phead h2{margin:0; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-2); font-weight:600}
  .phead .x{margin-left:auto; border:0; background:transparent; color:var(--ink-muted); cursor:pointer;
    border-radius:6px; padding:3px 7px; font-size:14px; line-height:1}
  .phead .x:hover{background:var(--line); color:var(--ink)}
  .pbody{overflow-y:auto; padding:12px 13px}
  .pbody::-webkit-scrollbar{width:8px}
  .pbody::-webkit-scrollbar-thumb{background:var(--rule); border-radius:8px}

  /* ---- stat tiles -------------------------------------------------------- */
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px}
  .tile{background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:9px 10px}
  .tile small{display:block; color:var(--ink-muted); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:3px}
  .tile b{font-size:18px; font-weight:600; letter-spacing:-.02em}   /* proportional figures */
  .tile.hero{grid-column:1/-1; background:transparent; border-color:var(--ring)}
  .tile.hero b{font-size:27px; display:block; line-height:1.1}
  .tile .sub{color:var(--ink-2); font-size:11px; margin-top:2px}

  /* ---- ranking table (the table-view twin of the map encoding) ----------- */
  table{width:100%; border-collapse:collapse; font-size:11.5px}
  th{color:var(--ink-muted); font-weight:500; text-align:right; padding:5px 4px; font-size:9.5px;
     letter-spacing:.06em; text-transform:uppercase; border-bottom:1px solid var(--rule); white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  td{padding:6px 4px; text-align:right; font-variant-numeric:tabular-nums; border-bottom:1px solid var(--line)}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--surface-2)}
  tbody tr.on{background:color-mix(in srgb,var(--m3) 13%,transparent)}
  tbody tr:last-child td{border-bottom:0}
  .rname{display:flex; align-items:center; gap:7px}
  .rname i{width:8px; height:20px; border-radius:3px; flex:0 0 auto}
  .rname span{display:block; max-width:132px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rname small{display:block; color:var(--ink-muted); font-size:10px}
  .rank{color:var(--ink-muted); font-size:10px; width:16px}
  .crown{color:var(--m3)}

  /* ---- legend (scale) ---------------------------------------------------- */
  .legend{
    flex:0 0 auto;
    background:color-mix(in srgb,var(--surface) 82%,transparent);
    backdrop-filter:blur(26px) saturate(150%);
    border:1px solid var(--ring); border-radius:13px; box-shadow:var(--shadow); padding:11px 13px;
  }
  /* La leyenda arranca plegada: título y rampa. El párrafo y la nota del stock
     gris salen con «¿Cómo leerlo?» — estaban siempre abiertos y eran media
     pantalla de texto que casi nadie lee dos veces. */
  .legend .lhead{display:flex; align-items:baseline; gap:8px}
  .legend .lhead h3{flex:1}
  .legend .lmore{border:0; background:transparent; color:var(--ink-muted); cursor:pointer;
    font-size:10.5px; padding:2px 4px; border-radius:5px; white-space:nowrap}
  .legend .lmore:hover{background:var(--line); color:var(--ink)}
  .legend .more{display:none}
  .legend.open .more{display:block}
  .legend.open p{margin-top:7px}
  .legend h3{margin:0 0 2px; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-2); font-weight:600}
  .legend p{margin:0 0 9px; font-size:11px; color:var(--ink-muted); line-height:1.4}
  .ramp{display:flex; gap:2px}                      /* 2px surface gap between fills */
  .ramp i{flex:1; height:9px; border-radius:2px}
  .ramp i:first-child{border-radius:4px 2px 2px 4px}
  .ramp i:last-child{border-radius:2px 4px 4px 2px}
  .rampax{display:flex; justify-content:space-between; margin-top:5px; font-size:10px;
          color:var(--ink-muted); font-variant-numeric:tabular-nums}
  .legend .ctxnote{display:flex; align-items:center; gap:7px; margin-top:9px; padding-top:9px;
    border-top:1px solid var(--line); font-size:10.5px; color:var(--ink-muted)}
  /* Conmutador de modo: dos botones pegados que se leen como uno. */
  .ctlgroup{display:flex}
  .ctlgroup .seg{border-radius:0;margin:0}
  .ctlgroup .seg:first-child{border-radius:8px 0 0 8px}
  .ctlgroup .seg:last-child{border-radius:0 8px 8px 0;border-left:0}
  /* La flecha de «buscar este edificio». Discreta hasta que se apunta a su
     fila: en una tabla de seis, seis enlaces encendidos pesan más que el dato. */
  td.ir{width:26px;text-align:right;padding-left:0}
  td.ir a{color:var(--ink-muted);text-decoration:none;font-size:13px;opacity:.55;
          transition:opacity .15s,color .15s}
  tr:hover td.ir a{opacity:1;color:var(--m4)}
  td.ir a:focus-visible{opacity:1;color:var(--m4);outline:2px solid var(--m3);outline-offset:2px}

  .ctlgroup .seg.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

  .legend .ctxnote i{width:11px;height:11px;border-radius:3px;background:var(--ctx-hi);flex:0 0 auto}

  /* ---- unit stack + charts ----------------------------------------------- */
  .sec{margin-top:14px; padding-top:13px; border-top:1px solid var(--line)}
  .sec:first-child{margin-top:0;padding-top:0;border-top:0}
  .sec h3{margin:0 0 8px; font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-muted); font-weight:600}
  .kv{display:flex; justify-content:space-between; align-items:baseline; padding:3px 0; font-size:12px}
  .kv span{color:var(--ink-2)}
  .kv b{font-variant-numeric:tabular-nums; font-weight:600}
  .stack{display:flex; flex-direction:column; gap:2px; margin-top:2px}
  .floor{display:flex; gap:2px; align-items:center}
  .floor em{width:20px; font-style:normal; font-size:9px; color:var(--ink-muted); text-align:right;
            font-variant-numeric:tabular-nums; flex:0 0 auto}
  .floor i{flex:1; height:8px; border-radius:2px; cursor:pointer}
  .floor i:hover{outline:2px solid var(--surface); outline-offset:0}
  .keys{display:flex; flex-wrap:wrap; gap:11px; margin-top:9px}
  .keys div{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-2)}
  .keys i{width:10px;height:10px;border-radius:3px}
  .bars{display:flex; align-items:flex-end; gap:2px; height:46px; margin-top:4px}
  .bars i{flex:1; background:var(--m3); border-radius:2px 2px 0 0; min-height:1px}
  .axis{display:flex; justify-content:space-between; color:var(--ink-muted); font-size:10px; margin-top:4px;
        border-top:1px solid var(--line); padding-top:3px; font-variant-numeric:tabular-nums}

  /* ---- map chrome -------------------------------------------------------- */
  .mapctl{position:absolute; left:50%; transform:translateX(-50%); bottom:16px; z-index:20; display:flex; gap:6px}
  .mapctl button{height:32px; padding:0 11px; border:1px solid var(--ring); border-radius:8px;
    background:color-mix(in srgb,var(--surface) 93%,transparent); backdrop-filter:blur(14px);
    box-shadow:var(--shadow); cursor:pointer; font-size:11.5px; font-weight:600}
  .mapctl button:hover{border-color:var(--rule)}
  .mapctl .sep{width:1px; background:var(--line); margin:0 2px}
  /* the basemap ships light-only; dim it in dark mode. Pins are HTML, so they stay full-strength. */
  :root[data-theme="dark"] .maplibregl-canvas{filter:brightness(.60) saturate(.78) contrast(1.06)}

  /* ---- money pins: the portfolio stays findable at every zoom ------------- */
  .pin{display:flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap; user-select:none}
  .pin i{position:relative; width:13px; height:13px; border-radius:50%; flex:0 0 auto;
         border:2px solid var(--surface); box-shadow:0 1px 5px rgba(0,0,0,.35)}
  .pin b,.pin em{font-style:normal; font-size:10.5px; font-weight:600; padding:2px 6px; border-radius:5px;
    border:1px solid var(--ring); background:color-mix(in srgb,var(--surface) 90%,transparent);
    backdrop-filter:blur(6px); box-shadow:0 1px 4px rgba(0,0,0,.10)}
  .pin em{color:var(--ink-2); font-variant-numeric:tabular-nums}
  .pin:hover b{border-color:var(--rule)}
  .pin.on b{outline:2px solid var(--m3); outline-offset:-1px}
  .pin.best i{width:17px; height:17px}
  .pin.best b{border-color:var(--m3)}
  .pin.best i::after{content:""; position:absolute; inset:-3px; border-radius:50%;
    border:2px solid var(--m4); animation:halo 2.1s ease-out infinite}
  @keyframes halo{0%{transform:scale(1);opacity:.7} 70%{transform:scale(2.8);opacity:0} 100%{opacity:0}}
  .far .pin b,.far .pin em{display:none}
  .far .pin i{width:9px;height:9px}
  .far .pin.best b{display:inline-block}      /* the winner keeps its name at every zoom */
  .far .pin.best i{width:15px;height:15px}
  .tipcard{min-width:160px; font:inherit}
  .tipcard b{font-size:13px; display:block}
  .tipcard span{display:block; color:var(--ink-muted); font-size:11px; margin-top:1px}
  .tipcard .v{margin-top:5px; font-size:12px; font-weight:600; font-variant-numeric:tabular-nums}
  .maplibregl-popup-content{background:var(--surface); color:var(--ink); border-radius:10px;
    border:1px solid var(--ring); box-shadow:var(--shadow); padding:10px 12px}
  .maplibregl-popup-tip{border-top-color:var(--surface)!important; border-bottom-color:var(--surface)!important}
  .toast{position:absolute; left:50%; top:14px; transform:translateX(-50%); z-index:40;
    background:var(--surface); border:1px solid var(--ring); border-radius:9px; box-shadow:var(--shadow);
    padding:8px 13px; font-size:12px; opacity:0; pointer-events:none; transition:opacity .2s}
  .toast.on{opacity:1}
  .showbtn{position:absolute; z-index:20; height:32px; padding:0 11px; border:1px solid var(--ring);
    border-radius:8px; background:color-mix(in srgb,var(--surface) 93%,transparent); backdrop-filter:blur(14px);
    box-shadow:var(--shadow); cursor:pointer; font-size:11.5px; font-weight:600; display:none}
  .showbtn.on{display:block}
  #showLeft{left:16px; top:16px}
  #showRight{right:16px; top:16px}

  /* Franja compacta bajo el héroe: dos datos en línea en vez de dos cajas. */
  .strip{display:flex; gap:18px; margin:9px 2px 12px}
  .strip span small{display:block; color:var(--ink-muted); font-size:9.5px; letter-spacing:.08em;
    text-transform:uppercase; margin-bottom:2px}
  .strip span b{font-size:15px; font-weight:600; font-variant-numeric:tabular-nums}

  @media(max-width:1280px){ .lens-wrap label{display:none} .brand small{display:none} }
  @media(max-width:1180px){ .rail-left{width:280px} .rail-right{width:300px} }
  @media(max-width:900px){
    body{overflow:auto} .app{position:static}
    .bar{flex-wrap:wrap} .search{width:100%; order:5}
    .stage{display:block; height:auto}
    #map{position:relative; inset:auto; height:60vh; min-height:380px}
    .rail{position:static; width:auto; height:auto; margin:10px 10px 0; justify-content:flex-start}
    .rail .panel{flex:none; max-height:none}
    .mapctl{position:static; transform:none; margin:10px; justify-content:center; flex-wrap:wrap}
    .showbtn{position:static; margin:10px}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<div class="app">

  <div class="bar">
    <div class="brand">
      <div class="mark">ED</div>
      <div><h1>Inteligencia de desarrollo</h1><small>Ciudad de Panamá</small></div>
    </div>

    <div class="search">
      <span class="icon">⌕</span>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Buscar un edificio o distrito…" aria-label="Buscar edificios por nombre">
      <button class="clear" id="qClear" aria-label="Limpiar la búsqueda">✕</button>
      <div class="results" id="qRes" role="listbox"></div>
    </div>

    <div class="lens-wrap">
      <label for="lens">Lente</label>
      <select class="ctl" id="lens" aria-label="Elegir la medida de rentabilidad que colorea el mapa"></select>
    </div>

    <div class="ctlgroup" role="group" aria-label="Modo del visor">
      <button class="ctl seg on" id="modoCartera">Cartera</button>
      <button class="ctl seg" id="modoEstudio">Estudio de mercado</button>
    </div>

    <select class="ctl" id="area" aria-label="Ir a una zona"></select>

    <div class="spacer"></div>
    <button class="ctl" id="theme">Oscuro</button>
  </div>

  <div class="stage">
    <div id="map" aria-label="Mapa 3D de la cartera de promociones en Ciudad de Panamá"></div>

    <button class="showbtn" id="showLeft">Ranking ▸</button>
    <button class="showbtn" id="showRight">◂ Ficha</button>

    <div class="rail rail-left">
      <section class="panel" id="leftPanel">
        <div class="phead"><h2 id="rankTitle">Ordenado por ROI</h2><button class="x" id="closeLeft" aria-label="Ocultar el panel">✕</button></div>
        <div class="pbody" id="rankBody"></div>
      </section>
      <div class="legend" id="legend"></div>
    </div>

    <div class="rail rail-right">
      <section class="panel" id="rightPanel">
        <div class="phead"><h2>Ficha del edificio</h2><button class="x" id="closeRight" aria-label="Ocultar el panel">✕</button></div>
        <div class="pbody" id="detailBody"></div>
      </section>
    </div>

    <div class="mapctl">
      <button id="fitAll">Vista general</button>
      <button id="tilt">2D view</button>
      <span class="sep"></span>
      <button id="zoomOut" aria-label="Alejar">−</button>
      <button id="zoomIn" aria-label="Acercar">+</button>
      <button id="north" aria-label="Volver al norte">N</button>
    </div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script type="module">
import * as maplibregl from './node_modules/maplibre-gl/dist/maplibre-gl.mjs';

/* ============================================================
   Deterministic data model — Panama City residential portfolio
   ============================================================ */
const rng = s => () => (s = s*1664525 + 1013904223 >>> 0, s / 4294967296);

/* ---- real buildings ---------------------------------------------------------
   Footprints, names, heights and positions come from OpenStreetMap (Overpass,
   fetched for this build). Each row is [name, district, floors, lat, lng, ring].
   The FINANCIALS below are still a deterministic model, not real deal data. */

/* Seven of the portfolio districts have no OSM footprints in this extract —
   Avenida Balboa, Santa María, Clayton, Panamá Pacífico, Casco Antiguo. Each
   borrows a footprint from the nearest district that does, in preference
   order. A borrowed footprint is still a real building outline; only the
   address is approximate, and that beats a box drawn from nothing. */
const NEARBY = {
  'Avenida Balboa':  ['Punta Paitilla','Bella Vista','Marbella'],
  'Santa María':     ['Costa del Este','San Francisco'],
  'Clayton':         ['El Carmen','Vista Hermosa','La Cresta'],
  'Panamá Pacífico': ['La Cresta','El Chorrillo','Santa Ana'],
  'Casco Antiguo':   ['Santa Ana','El Chorrillo'],
};

/* Pick the free footprint whose height is closest to the promotion's, so a
   44-floor tower does not land on a 7-floor outline. */
const TAKEN = new Set();
function footprintFor(district, floors){
  for(const d of [district, ...(NEARBY[district] || [])]){
    let best = -1, gap = Infinity;
    for(let i=0;i<OSM.length;i++){
      if(TAKEN.has(i) || OSM[i][1] !== d) continue;
      const g = Math.abs(OSM[i][2] - floors);
      if(g < gap){ gap = g; best = i; }
    }
    if(best >= 0){ TAKEN.add(best); return OSM[best]; }
  }
  for(let i=0;i<OSM.length;i++) if(!TAKEN.has(i)){ TAKEN.add(i); return OSM[i]; }
}

const PROJECTS = CARTERA.map(([id,name,district,floors,gdv,margin,etapa],i)=>{
  const seed = 7919 + i*131, r = rng(seed);
  const b = DISTRICT_BASE[district] || DEFAULT_BASE;
  const [,,,lat,lng,ring] = footprintFor(district, floors);
  return {
    id, name, district, etapa, lat, lng, ring, floors,
    cols: floors>=40 ? 4 : 3, rows:2,
    ppm2:   Math.round(b.ppm2   * (0.93 + r()*0.16)),
    costM2: Math.round(b.costM2 * (0.94 + r()*0.13)),
    /* `land` is not an input any more — it is solved from the target margin
       in feas(). Kept as a floor so an estimate built from a context building,
       which has no target, still has a land cost. */
    land:   Math.round((floors*0.34 + 2.1) * (0.85 + r()*0.45) * 1e6),
    targetGdv: gdv, targetMargin: margin,
    /* Share of total cost that is land. Panama City waterfront runs land-heavy
       and the suburbs do not, so it varies by promotion rather than sitting at
       a single figure. */
    landPct: +(0.15 + r()*0.11).toFixed(3),
    softPct:+(0.11  + r()*0.07 ).toFixed(3),
    finPct: +(0.045 + r()*0.025).toFixed(3),
    launch:'2025-06', seed, age: 4 + Math.floor(r()*20),
  };
});

const MONTHS = 30;                       // sales window modelled
const TYPES = [
  {k:'1BR', area:[62,78]}, {k:'2BR', area:[92,124]},
  {k:'3BR', area:[136,168]}, {k:'PH', area:[210,290]},
];

function buildProject(p){
  const r = rng(p.seed);
  const perFloor = p.cols*p.rows;
  const units = [];
  const age = p.age ?? (6 + p.seed%12);
  for(let f=1; f<=p.floors; f++){
    const hi = f/p.floors;
    for(let i=0;i<perFloor;i++){
      const cx = i % p.cols, cz = (i/p.cols)|0;
      const corner = (cx===0||cx===p.cols-1) && (cz===0||cz===p.rows-1);
      const isPH  = f > p.floors-2;
      const t = isPH ? TYPES[3] : corner ? TYPES[2] : (r()>.45 ? TYPES[1] : TYPES[0]);
      const area = +(t.area[0] + r()*(t.area[1]-t.area[0])).toFixed(1);
      const viewF = 1 + (corner?.06:0) + (cz===0?.045:0);
      const floorF = 1 + hi*0.22 + (isPH?0.18:0);
      const ppm2 = p.ppm2 * viewF * floorF * (0.97 + r()*0.06);
      const price = Math.round(area*ppm2/500)*500;
      const desirability = 0.55 + 0.45*(1-hi) + (corner?.08:0);
      const soldBy = Math.round((1-desirability)*MONTHS + r()*10);
      const status = soldBy <= age ? 'sold' : (soldBy <= age+3 && r()>.55 ? 'reserved' : 'available');
      const month = status==='available' ? null : Math.max(0, Math.min(age, soldBy));
      const disc = status==='sold' ? (r()*0.09) : 0;
      units.push({
        id:`${p.id}-${String(f).padStart(2,'0')}${String.fromCharCode(65+i)}`,
        proj:p.id, floor:f, idx:i, cx, cz, type:t.k, area, ppm2, price,
        status, month, net: Math.round(price*(1-disc)),
        buyer: ['Local end-user','Investor (local)','Foreign investor','Corporate','Pre-sale VIP'][(r()*5)|0],
        pay: ['Bank mortgage','Cash','Developer plan','Mortgage + trust'][(r()*4)|0],
      });
    }
  }
  return {...p, perFloor, units, age};
}

/* Two passes. The unit mix is generated from the tower's shape, so the gross
   sales value it adds up to is whatever the shape happens to give; the second
   pass rescales the price per m² by the ratio to the portfolio's real figure
   and rebuilds. After it, the map's "gross sales value" is the panel's
   `ventas` to within the 500-dollar rounding of individual unit prices. */
function calibrate(p){
  const built = buildProject(p);
  if(!p.targetGdv) return built;
  const gdv = built.units.reduce((a,u)=>a+u.price,0);
  if(!gdv) return built;
  return buildProject({...p, ppm2: p.ppm2 * (p.targetGdv/gdv)});
}
const DATA = PROJECTS.map(calibrate);
const byId = new Map(DATA.map(p=>[p.id,p]));

/* ---------- feasibility engine ---------- */
function feas(p){
  const u = p.units, n = u.length;
  const sold = u.filter(x=>x.status==='sold'), resv = u.filter(x=>x.status==='reserved');
  const sellableM2 = u.reduce((a,x)=>a+x.area,0);
  const gdv  = u.reduce((a,x)=>a+x.price,0);
  const contracted = sold.reduce((a,x)=>a+x.net,0) + resv.reduce((a,x)=>a+x.net,0);
  /* Two ways of getting to the cost stack.
     A context building clicked on the map has no target, so it is priced
     bottom-up from the district's build cost.
     A portfolio promotion has a margin that the panel already publishes, so
     the stack is solved top-down from it: the total is fixed by the margin,
     `landPct` splits it between land and construction, and the build cost per
     m² comes out of the division. Solving only for land — the first attempt —
     drove it negative on the towers, because the district build cost alone
     already exceeded what the margin left. */
  let hard, soft, fin, land;
  if(p.targetMargin != null){
    const objetivo = gdv * (1 - p.targetMargin);
    const K = (1 + p.softPct) * (1 + p.finPct);
    land = objetivo * p.landPct;
    hard = (objetivo - land) / K;
    soft = hard * p.softPct;
    fin  = (hard + soft) * p.finPct;
  } else {
    hard = sellableM2*1.32*p.costM2;
    soft = hard*p.softPct;
    fin  = (hard+soft)*p.finPct;
    land = p.land;
  }
  const cost = land + hard + soft + fin;
  /* The build cost per m² that the solved stack implies, for the detail panel:
     it is a result here, not an input. */
  const costM2 = hard / (sellableM2 * 1.32);
  const profit = gdv - cost, margin = profit/gdv, roi = profit/cost;
  const velocity = sold.length/Math.max(1,p.age);
  const remaining = n - sold.length - resv.length;
  const monthsOut = remaining/Math.max(.35, velocity);
  const beUnits = Math.ceil(cost/(gdv/n));
  const lifeMonths = Math.max(12, p.age + monthsOut + 8);
  const irr = Math.pow(1+roi, 12/lifeMonths)-1;
  const profitPerMonth = profit/lifeMonths;
  return {n, sellableM2, gdv, contracted, cost, hard, soft, fin, land, costM2, profit, margin, roi, irr,
          velocity, remaining, monthsOut, lifeMonths, profitPerMonth, beUnits,
          sold:sold.length, resv:resv.length, absorbed:(sold.length+resv.length)/n, avgPpm2:gdv/sellableM2};
}
const gCache = new Map();
const G = p => { if(!gCache.has(p.id)) gCache.set(p.id, feas(p)); return gCache.get(p.id); };

/* --------------------------------------------------------------------------
   Referencias de zona.

   Un mapa de cartera contesta «cómo va este edificio». La pregunta que le sigue
   siempre es «y cómo va la zona», y hasta ahora no la contestaba nadie: había
   que salir a la lista de proyectos y filtrar a mano por distrito.

   Todo lo que sale aquí está calculado, no inventado. Dos fuentes distintas y
   conviene no confundirlas:

     · La CARTERA — las promociones propias que caen en el distrito. De ahí
       salen las etapas, la absorción, el inventario y el precio medio real.
     · El CONTEXTO — las huellas de OpenStreetMap del mismo distrito, que son
       edificios reales sin modelo financiero detrás. De ahí sale el perfil de
       stock construido: cuántos hay y de qué altura.

   La comparación de precio es entre iguales: el proyecto abierto contra el
   precio medio de las promociones propias del mismo distrito. `DISTRICT_BASE`
   no sirve para esto aunque lo parezca — es la base con la que el modelo tasa
   un edificio de contexto al pincharlo, y para la cartera queda anulada por la
   calibración que ajusta el precio por m² a los ingresos reales de cada
   promoción. Contrastar una cosa contra la otra daba primas de hasta −53 % que
   no son un hallazgo: son el residuo de nuestra propia calibración.
   -------------------------------------------------------------------------- */
const zonaCache = new Map();

function zona(distrito){
  if(zonaCache.has(distrito)) return zonaCache.get(distrito);

  const propias = DATA.filter(p => p.district === distrito && !p.estimated);

  /* Etapas, en el orden en que avanza una promoción. */
  const ORDEN_ETAPA = ['Factibilidad','Diseño','Permisos','En obra','Preventa','Entregado'];
  const etapas = ORDEN_ETAPA
    .map(e => ({ e, n: propias.filter(p => p.etapa === e).length }))
    .filter(x => x.n > 0);

  let uds = 0, vendidas = 0, reservadas = 0, gdv = 0, m2 = 0, coste = 0;
  for(const p of propias){
    const g = G(p);
    uds += g.n; vendidas += g.sold; reservadas += g.resv;
    gdv += g.gdv; m2 += g.sellableM2; coste += g.cost;
  }
  const ppm2 = m2 ? gdv / m2 : 0;

  /* Stock construido: las huellas reales del distrito que no son cartera. */
  const usadas = new Set(propias.map(p => p.name));
  const stock = OSM.filter(o => o[1] === distrito && !usadas.has(o[0]));
  const plantas = stock.map(o => o[2]);

  const z = {
    distrito,
    promociones: propias.length,
    etapas,
    uds, vendidas, reservadas,
    disponibles: uds - vendidas - reservadas,
    absorcion: uds ? (vendidas + reservadas) / uds : 0,
    gdv,
    margen: gdv ? (gdv - coste) / gdv : 0,
    ppm2,
    stock: stock.length,
    plantasMedia: plantas.length ? plantas.reduce((a,b)=>a+b,0) / plantas.length : 0,
    plantasMax: plantas.length ? Math.max(...plantas) : 0,
  };
  zonaCache.set(distrito, z);
  return z;
}

/** Puesto de una promoción dentro de su distrito, por la lente activa. */
function puestoEnZona(p){
  const L = lens();
  const pares = DATA.filter(x => x.district === p.district && !x.estimated)
    .map(x => ({ id: x.id, v: L.get(G(x)) }))
    .sort((a,b) => b.v - a.v);
  return { puesto: pares.findIndex(x => x.id === p.id) + 1, de: pares.length };
}

/* ---------- formatting ---------- */
const M  = v => { const a = Math.abs(v), s = v<0?'-':'';
  return a>=1e9 ? s+'$'+(a/1e9).toFixed(2)+'B' : s+'$'+(a/1e6).toFixed(a>=1e7?1:2)+'M'; };
const K  = v => (v<0?'-':'')+'$'+Math.round(Math.abs(v)/1e3)+'k';
const $  = v => '$'+Math.round(v).toLocaleString('en-US');
const pc = v => (v*100).toFixed(1)+'%';

/* ============================================================
   Money lenses — the "which building makes the best money" model
   ============================================================ */
const LENSES = {
  roi:    {label:'ROI sobre coste',   short:'ROI',      fmt:pc, get:g=>g.roi,
           why:'Utilidad ÷ costo total. Lo que devuelve cada dólar realmente puesto — la lente correcta cuando lo que escasea es el capital y no el suelo.'},
  irr:    {label:'TIR anualizada',    short:'TIR',      fmt:pc, get:g=>g.irr,
           why:'El ROI repartido sobre el plazo real de venta. Un 40 % en dos años gana a un 55 % en seis: ésta es la lente que le pone precio al tiempo.'},
  ppm:    {label:'Utilidad por mes',  short:'$/mes',    fmt:K,  get:g=>g.profitPerMonth,
           why:'Utilidad ÷ meses del lanzamiento al cierre de ventas. La velocidad a la que el capital vuelve para el siguiente solar — la lente del operador.'},
  profit: {label:'Utilidad total',    short:'Utilidad', fmt:M,  get:g=>g.profit,
           why:'El tamaño absoluto del premio, sin mirar cuánto capital ni cuánto tiempo costó. Aquí ganan siempre las torres grandes.'},
  margin: {label:'Margen sobre ingresos', short:'Margen', fmt:pc, get:g=>g.margin,
           why:'Utilidad ÷ ingresos por venta. El colchón: cuánto pueden caer los precios antes de que la operación deje de sostenerse.'},
};
let lensKey = 'roi';
const lens = () => LENSES[lensKey];

/* --------------------------------------------------------------------------
   Los dos modos del visor.

   `cartera` — sólo se pueden pinchar las promociones propias. Los edificios de
   la ciudad quedan de contexto y nada más: ni cursor de mano, ni estimación al
   pulsarlos. Es el modo de trabajo, el de «cómo van mis dieciocho».

   `estudio` — el visor se convierte en un estudio de zona. El panel de la
   izquierda deja de ordenar promociones y pasa a ordenar distritos, con lo que
   se le pregunta a un mercado: cuánta obra hay, a qué precio se está vendiendo,
   qué absorción lleva y cuánto stock construido tiene alrededor. Y ahí sí se
   puede pinchar cualquier edificio de la ciudad, porque en este modo un
   edificio ajeno es un comparable: al pulsarlo se le monta una factibilidad
   con la base de precio de su distrito.

   El mismo mapa contesta dos preguntas distintas y no conviene mezclarlas: en
   el modo de trabajo, un clic accidental en una torre ajena sacaba una ficha
   con cifras inventadas al lado de las reales.
   -------------------------------------------------------------------------- */
let modo = 'cartera';

/* score every building 0..1 on the active lens, for the colour ramp */
let scored = [], vMin = 0, vMax = 1;
function rescore(){
  const L = lens();
  scored = DATA.map(p => ({p, v:L.get(G(p))})).sort((a,b)=>b.v-a.v);
  vMin = Math.min(...scored.map(s=>s.v));
  vMax = Math.max(...scored.map(s=>s.v));
  scored.forEach(s => s.score = vMax===vMin ? 1 : (s.v-vMin)/(vMax-vMin));
  scored.forEach((s,i) => s.rank = i+1);
}
const scoreOf = id => scored.find(s=>s.p.id===id);

/* ---------- ramp: one hue, monotone lightness, validated ---------- */
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ramp = () => ['--m1','--m2','--m3','--m4','--m5'].map(css);
const rampColor = t => ramp()[Math.min(4, Math.max(0, Math.round(t*4)))];
const isDark = () => document.documentElement.dataset.theme === 'dark';

/* ============================================================
   Map
   ============================================================ */
const CENTER = [ DATA.reduce((a,p)=>a+p.lng,0)/DATA.length,
                 DATA.reduce((a,p)=>a+p.lat,0)/DATA.length ];
const map = new maplibregl.Map({
  container:'map', style:'https://tiles.openfreemap.org/styles/liberty',
  center:CENTER, zoom:13.6, pitch:40, bearing:-18, antialias:true, maxPitch:80,
});
/* no NavigationControl — its fixed corner collides with the rails; the bottom cluster replaces it */

let mapReady = false, cur = DATA[0], popup = null;

/* footprint: the building's real OSM outline, inset slightly so our extrusion
   sits just inside the basemap's own shape instead of z-fighting its walls */
function footprint(p){
  const ring = p.ring, n = ring.length - 1;
  let cx = 0, cy = 0;
  for(let i=0;i<n;i++){ cx += ring[i][0]; cy += ring[i][1] }
  cx /= n; cy /= n;
  const k = 0.88;
  return ring.map(([x,y]) => [cx + (x-cx)*k, cy + (y-cy)*k]);
}
function geo(){
  const L = lens();
  return {type:'FeatureCollection', features:DATA.map(p=>{
    const s = scoreOf(p.id), g = G(p);
    return {type:'Feature', id:p.id, properties:{
      id:p.id, name:p.name, district:p.district, rank:s.rank, score:s.score,
      value:L.fmt(s.v), height:Math.max(18, p.floors*3.2 + 2), best:s.rank===1?1:0,
    }, geometry:{type:'Polygon', coordinates:[footprint(p)]}};
  })};
}
/* Pins are HTML markers, so only the ones in view are built. The cap mattered
   more when this drew all 240 OSM buildings; with the portfolio down to
   eighteen it is headroom, and it still applies to estimates built by clicking
   context buildings. `scored` is rank-sorted, so the cap keeps the
   best-performing ones visible. */
let pins = [], pinKey = '';
const PIN_CAP = 70;
function renderPins(){
  if(!mapReady) return;
  const b = map.getBounds();
  const show = scored.filter(s => b.contains([s.p.lng, s.p.lat])).slice(0, PIN_CAP);
  const key = show.map(s=>s.p.id).join(',') + '|' + lensKey + '|' + (isDark()?'d':'l') + '|' + cur.id;
  if(key === pinKey) return;
  pinKey = key;
  pins.forEach(m=>m.remove()); pins = [];
  const L = lens();
  show.forEach(s=>{
    const d = document.createElement('div');
    d.className = 'pin' + (s.rank===1?' best':'') + (s.p.id===cur.id?' on':'');
    d.innerHTML = `<i style="background:${rampColor(s.score)}"></i>`
                + `<b>${s.rank===1?'★ ':''}${s.p.name}</b><em>${L.fmt(s.v)}</em>`;
    d.title = `${s.p.name} · ${s.p.district} · ${L.short} ${L.fmt(s.v)} · rank ${s.rank} of ${DATA.length}`;
    d.onclick = ev => { ev.stopPropagation(); select(s.p) };
    pins.push(new maplibregl.Marker({element:d, anchor:'left'})
      .setLngLat([s.p.lng, s.p.lat]).addTo(map));
  });
}
const markPins = renderPins;

/* colour expression: continuous magnitude -> the one-hue ramp */
function towerColor(){
  const c = ramp();
  return ['interpolate',['linear'],['get','score'],
          0,c[0], .25,c[1], .5,c[2], .75,c[3], 1,c[4]];
}
function contextColor(){
  return ['interpolate',['linear'],['coalesce',['get','render_height'],10],
          0,css('--ctx-lo'), 120,css('--ctx-hi')];
}

map.on('load', ()=>{
  mapReady = true;
  map.getStyle().layers.forEach(l=>{
    if(l.type==='symbol' && l.layout?.['icon-image']){ try{ map.setPaintProperty(l.id,'icon-opacity',0) }catch{} }
  });

  /* context city — deliberately recessive, so the money ramp is the only colour that carries meaning */
  if(map.getLayer('building-3d')){
    map.setLayoutProperty('building-3d','visibility','visible');
    map.setPaintProperty('building-3d','fill-extrusion-color', contextColor());
    map.setPaintProperty('building-3d','fill-extrusion-opacity',.92);
    map.setPaintProperty('building-3d','fill-extrusion-vertical-gradient',true);
  }
  if(typeof map.setLight==='function') map.setLight({anchor:'viewport',color:'#fff8e8',intensity:.55,position:[1.15,205,35]});

  map.addSource('portfolio',{type:'geojson',data:geo()});
  map.addLayer({id:'towers',type:'fill-extrusion',source:'portfolio',paint:{
    'fill-extrusion-color':towerColor(),
    'fill-extrusion-height':['get','height'],
    'fill-extrusion-base':0,
    'fill-extrusion-opacity':.97,
    'fill-extrusion-vertical-gradient':true,
  }});

  /* La torre seleccionada.
     Antes esta capa servía para las estimaciones de contexto, que ya no se
     hacen. Ahora marca la promoción abierta, que era lo que faltaba: con
     dieciocho torres del mismo color de rampa, encontrar la que está abierta en
     el panel obligaba a leer los rótulos uno a uno.

     Va en tres piezas y no en una: el volumen sólido, un halo bajo de doce
     metros que la separa del suelo, y el borde. Un simple cambio de color no
     bastaba — en la rampa de dinero el color ya significa otra cosa. */
  map.addSource('picked',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'picked-halo',type:'fill-extrusion',source:'picked',paint:{
    'fill-extrusion-color':css('--m3'),
    'fill-extrusion-height':12,
    'fill-extrusion-base':0,
    'fill-extrusion-opacity':.28,
  }});
  map.addLayer({id:'picked-hl',type:'line',source:'picked',paint:{
    'line-color':css('--m5'),
    'line-width':2.2,
    'line-opacity':.9,
  }});

  /* Sólo las torres de la cartera responden al puntero. El contexto de ciudad
     es dato de zona, no un objeto que se abre: una ficha con cifras estimadas
     al lado de las reales confunde más de lo que informa, y en el estudio de
     mercado esos edificios cuentan como stock construido, no como fichas. */
  map.on('mouseenter','towers',()=>map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','towers',()=>{map.getCanvas().style.cursor=''; popup?.remove(); popup=null});
  map.on('mousemove','towers',e=>{
    const f = e.features?.[0]; if(!f) return;
    popup?.remove();
    popup = new maplibregl.Popup({closeButton:false,offset:14,className:'t'})
      .setLngLat(e.lngLat)
      .setHTML(`<div class="tipcard"><b>${f.properties.name}</b><span>${f.properties.district} · rank ${f.properties.rank} of ${DATA.length}</span><div class="v">${lens().short} ${f.properties.value}</div></div>`)
      .addTo(map);
  });
  map.on('click','towers',e=>{ const p = byId.get(e.features?.[0]?.properties?.id); if(p) select(p,{fly:false}) });

  /* dots at every zoom; names only once you're close enough that 100+ won't collide */
  const farClass = ()=>document.body.classList.toggle('far', map.getZoom() < 15.2);
  map.on('zoom', farClass); farClass();
  map.on('moveend', renderPins);

  refreshMap();
  /* Selección inicial sin abrir la ficha: al cargar, el mapa manda. La ficha
     sale al pinchar una torre o una fila. */
  select(DATA[0], {fly:false, abrir:false});
});

function refreshMap(){
  if(!mapReady) return;
  map.getSource('portfolio')?.setData(geo());
  map.setPaintProperty('towers','fill-extrusion-color', towerColor());
  if(map.getLayer('building-3d')) map.setPaintProperty('building-3d','fill-extrusion-color', contextColor());
  /* La marca de selección son dos capas de tipos distintos: el halo es una
     extrusión y el borde una línea. Pedirle `fill-extrusion-color` a la línea
     —que es lo que hacía este renglón desde que la capa cambió de tipo— hace
     saltar a MapLibre en cada cambio de tema. */
  if(map.getLayer('picked-halo')) map.setPaintProperty('picked-halo','fill-extrusion-color', css('--m3'));
  if(map.getLayer('picked-hl'))   map.setPaintProperty('picked-hl','line-color', css('--m5'));
  pinKey = '';                      // force a rebuild: colours or lens changed
  renderPins();
}

/* ---------- clicking any OSM building builds an estimated pro-forma ---------- */
/* real neighbourhood centres from OpenStreetMap — nearest one wins */
const ANCHORS = {
  'Punta Pacífica':[8.97644,-79.50794], 'Punta Paitilla':[8.97527,-79.51478],
  'Marbella':[8.97820,-79.52228],       'Bella Vista':[8.98377,-79.52599],
  'Obarrio':[8.98646,-79.51892],        'El Cangrejo':[8.98975,-79.52734],
  'San Francisco':[8.99277,-79.50806],  'Coco del Mar':[8.99586,-79.49664],
  'Costa del Este':[9.01318,-79.46807], 'La Cresta':[8.97987,-79.53159],
  'El Carmen':[8.99560,-79.52342],      'Vista Hermosa':[9.00029,-79.52136],
  'Santa Ana':[8.95599,-79.54067],      'El Chorrillo':[8.94984,-79.54415],
};
function districtAt(lat,lng){
  let best = 'Bella Vista', bd = Infinity;
  for(const [n,[a,b]] of Object.entries(ANCHORS)){
    const d = ((a-lat)*111320)**2 + ((b-lng)*111320*Math.cos(lat*Math.PI/180))**2;
    if(d < bd){ bd = d; best = n }
  }
  return best;
}
const BASE_PPM2 = Object.fromEntries(
  Object.entries(DISTRICT_BASE).map(([k,v])=>[k, v.ppm2]));

   UI
   ============================================================ */

      </tbody>
    </table>`;
  el('rankBody').querySelectorAll('tr[data-id]').forEach(tr=>{
    tr.onclick = ()=>select(byId.get(tr.dataset.id));
  });
}

/* ---- right: one building ---- */
/**
 * La competencia de la zona.
 *
 * Esto es lo que antes se llamaba «proyectos similares» y enseñaba las otras
 * promociones propias del distrito. Estaba mal planteado: comparar la cartera
 * consigo misma no dice si el solar es bueno, dice cuál de los tuyos va mejor
 * — y eso ya lo contesta el ranking de la izquierda.
 *
 * La competencia son los edificios del distrito que NO son tuyos. Existen, son
 * huellas reales de OpenStreetMap con su nombre, su altura y su planta, y se
 * les monta una factibilidad con la base de precio de su distrito: el mismo
 * motor que tasa la cartera, con las mismas reglas de coste, blandos y
 * financiación.
 *
 * El resultado es una estimación y va rotulado como tal en la pantalla. Lo que
 * sí es firme es el edificio: está construido, ocupa ese solar y compite por
 * los mismos compradores. Estimar mal su margen no cambia eso.
 */
const compCache = new Map();

/**
 * La base observada de un distrito.
 *
 * No es `DISTRICT_BASE`. Ésa es la tarifa bruta con la que el modelo tasaba
 * antes de calibrar; la cartera ya no la usa, porque su precio por m² se ajusta
 * a los ingresos reales de cada promoción y su coste se despeja del margen
 * publicado.
 *
 * Tasar la competencia con la tarifa bruta y la cartera con la calibrada no es
 * un estudio de mercado: es una regla amañada. Con ella, las dieciocho propias
 * salían por delante de todos sus vecinos —ROI 64 % contra 41 % en Punta
 * Pacífica— y una comparación que siempre gana el mismo no informa de nada.
 *
 * Aquí la base sale de lo que la propia cartera consigue en ese distrito:
 * precio por m² y coste de obra por m² medios de las promociones que hay allí.
 * Así los dos lados juegan con las mismas reglas y el resultado puede ir en
 * cualquier dirección, que es lo que se le pide a un comparable.
 */
const baseZonaCache = new Map();

function baseZona(distrito){
  if(baseZonaCache.has(distrito)) return baseZonaCache.get(distrito);
  const propias = DATA.filter(x => x.district === distrito && !x.estimated && !x.ajena);
  const bruta = DISTRICT_BASE[distrito] || DEFAULT_BASE;

  let base;
  if(!propias.length){
    base = { ppm2: bruta.ppm2, costM2: bruta.costM2 };
  } else {
    const gs = propias.map(G);
    const media = f => gs.reduce((a, g) => a + f(g), 0) / gs.length;
    base = { ppm2: media(g => g.avgPpm2), costM2: media(g => g.costM2) };
  }
  baseZonaCache.set(distrito, base);
  return base;
}

function estimarOSM(o){
  const [name, district, floors, lat, lng, ring] = o;
  const clave = name + '@' + district;
  if(compCache.has(clave)) return compCache.get(clave);

  /* Semilla estable a partir del nombre: la misma torre da siempre la misma
     estimación, aunque se repinte el panel o se cambie de lente. */
  let seed = 2166136261;
  for(const ch of clave) seed = Math.imul(seed ^ ch.charCodeAt(0), 16777619) >>> 0;

  /* Base de la zona más una dispersión de ±12 %: dos promotores en la misma
     calle no consiguen el mismo precio ni pagan el mismo metro de obra, y sin
     dispersión los seis rivales saldrían clavados entre sí. */
  const b = baseZona(district);
  const disp = k => 0.88 + ((seed >> k) % 25) / 100;
  const p = buildProject({
    id: 'comp-' + (seed % 1e6), name, district, lat, lng, ring, floors,
    cols: floors >= 40 ? 4 : 3, rows: 2,
    ppm2:   Math.round(b.ppm2   * disp(3)),
    costM2: Math.round(b.costM2 * disp(9)),
    /* El suelo, en la misma proporción del coste total que lleva la cartera. */
    land:   Math.round((floors * 0.34 + 2.1) * (0.85 + (seed % 40) / 100) * 1e6),
    softPct: +(0.11 + (seed % 7) / 100).toFixed(3),
    finPct:  +(0.045 + (seed % 3) / 100).toFixed(3),
    launch: '2025-06', seed, age: 4 + (seed % 18),
    ajena: true,
  });
  compCache.set(clave, p);
  return p;
}

/**
 * Los rivales del distrito, ordenados por la lente activa.
 *
 * Se recortan a seis: la lista completa de El Cangrejo son cincuenta y ocho
 * torres, y una tabla de cincuenta y ocho filas en un panel de 380 px no se
 * lee, se cierra.
 */
function rivales(p, tope = 6){
  const propias = new Set(DATA.filter(x => !x.estimated && !x.ajena).map(x => x.name));
  /* Ordenados por precio por m², que es la columna que enseña la tabla.
     Ordenar por la lente activa —ROI— y listar precios daba «los seis mayores»
     de una cosa con los números de otra: el primero de la lista podía ser el
     cuarto más caro y nada en pantalla lo explicaba. */
  return OSM
    .filter(o => o[1] === p.district && !propias.has(o[0]))
    .map(estimarOSM)
    .map(x => ({ x, v: G(x).avgPpm2 }))
    .sort((a, b) => b.v - a.v)
    .slice(0, tope);
}

/**
 * El bloque de mercado: contra quién compite y quién le gana.
 *
 * Dos tablas, y la primera es la que importa: los edificios del distrito que no
 * son tuyos, con su factibilidad estimada, ordenados por la lente activa y
 * marcando cuáles están por encima de la promoción abierta. Ésa es la pregunta
 * de un estudio de mercado — no «cuál de los míos va mejor», sino «quién lo
 * está haciendo mejor que yo en este solar».
 *
 * La segunda son promociones propias de escala parecida en otras zonas. Se
 * queda porque contesta otra cosa legítima: si el problema es la zona o es el
 * producto.
 */
function mercadoHTML(p){
  const L = lens();
  const gp2 = G(p).avgPpm2;
  const lista = rivales(p);
  /* Cuántos piden más por metro que la promoción abierta. */
  const porEncima = lista.filter(r => G(r.x).avgPpm2 > gp2).length;

  const propias = DATA.filter(x => !x.estimated && !x.ajena);
  const porTipo = propias
    .filter(x => x.id !== p.id && x.district !== p.district)
    .map(x => ({ x, d: Math.abs(x.floors - p.floors) / p.floors }))
    .filter(o => o.d <= 0.35)
    .sort((a, b) => a.d - b.d)
    .slice(0, 4)
    .map(o => o.x);

  /* La columna es el precio de venta por m², no el ROI.
     El ROI de un edificio ajeno es una estimación entera: sale de un coste de
     obra, un suelo y una financiación que nadie nos ha enseñado, y presentarlo
     a una décima —«+49,3 pp»— le da una firmeza que no tiene. El precio por m²
     es la mitad del cálculo y la mitad que sí se comprueba: es lo que se pide
     en la calle por ese producto en esa zona.

     El enlace abre una búsqueda del edificio. No tenemos su web —son huellas de
     OpenStreetMap, no promotoras— así que lo honesto es llevar a buscarlo, no
     inventar una dirección. */
  const filaRival = ({ x }) => {
    const g = G(x);
    const d = gp2 ? g.avgPpm2 / gp2 - 1 : 0;
    const caro = d > 0;
    const busca = 'https://www.google.com/search?q=' +
      encodeURIComponent(`${x.name} ${x.district} Panamá edificio`);
    return `<tr data-vuela="${x.lng},${x.lat}">
      <td><div class="rname"><span>${x.name}<small>${x.floors} plantas · ${g.n} uds</small></span></div></td>
      <td>${$(g.avgPpm2)}</td>
      <td style="color:${caro ? 'var(--resv)' : 'var(--good)'}">${
        caro ? '+' : '−'}${(Math.abs(d) * 100).toFixed(0)} %</td>
      <td class="ir"><a href="${busca}" target="_blank" rel="noreferrer"
        title="Buscar ${x.name}" aria-label="Buscar ${x.name}">↗</a></td>
    </tr>`;
  };

  const filaPropia = x => {
    const g = G(x), gp = G(p);
    const d = gp.avgPpm2 ? g.avgPpm2 / gp.avgPpm2 - 1 : 0;
    return `<tr data-id="${x.id}">
      <td><div class="rname"><span>${x.name}<small>${x.district} · ${x.floors} plantas</small></span></div></td>
      <td>${$(g.avgPpm2)}</td>
      <td style="color:${d >= 0 ? 'var(--good)' : 'var(--resv)'}">${
        d >= 0 ? '+' : '−'}${(Math.abs(d) * 100).toFixed(0)} %</td>
    </tr>`;
  };

  return `
    <div class="sec">
      <h3>Competencia en ${p.district}</h3>
      ${lista.length ? `
        <div class="kv"><span>Edificios ajenos en el distrito</span><b>${
          OSM.filter(o => o[1] === p.district).length - propias.filter(x => x.district === p.district).length
        }</b></div>
        <div class="kv"><span>Piden más por m² que ésta</span><b style="${
          porEncima ? 'color:var(--resv)' : ''}">${porEncima} de ${lista.length}</b></div>
        <div class="kv"><span>Esta promoción</span><b>${$(gp2)} /m²</b></div>
        <table style="margin-top:10px">
          <thead><tr><th>Edificio ajeno</th><th>$/m²</th><th>vs ésta</th><th></th></tr></thead>
          <tbody>${lista.map(filaRival).join('')}</tbody>
        </table>
        <div class="ctxnote" style="margin-top:10px">
          <i style="background:var(--resv)"></i>Los edificios son reales: huella, nombre y altura de
          OpenStreetMap. El precio por m² es el que le sale al mismo motor que tasa tu cartera con la
          base de la zona. Pincha la fila para volar hasta él, o la flecha para buscarlo.
        </div>`
      : `<div class="ctxnote" style="margin-top:8px"><i></i>No hay edificios ajenos registrados en
          este distrito: la promoción no tiene competencia construida alrededor.</div>`}

      ${porTipo.length ? `
        <h3 style="margin-top:18px">Tuyas, de escala parecida</h3>
        <table>
          <thead><tr><th>Promoción</th><th>$/m²</th><th>vs ésta</th></tr></thead>
          <tbody>${porTipo.map(filaPropia).join('')}</tbody>
        </table>
        <div class="ctxnote" style="margin-top:10px">
          <i style="background:var(--m3)"></i>Otras zonas, misma escala. Sirve para separar el
          problema: si aquí va peor que en las demás, es la zona; si va igual, es el producto.
        </div>` : ''}
    </div>`;
}

/** El bloque de zona de la ficha, en su propia función: se coloca arriba o
 *  abajo según el modo, y una plantilla de sesenta líneas duplicada no. */
function zonaHTML(p, g, L){

      const z = zona(p.district);
      if(!z.promociones) return '';
      const r = puestoEnZona(p);
      /* Este proyecto contra el precio medio de su distrito. Con una sola
         promoción en la zona la comparación es consigo mismo, así que no se
         enseña. */
      const dif = z.ppm2 ? g.avgPpm2 / z.ppm2 - 1 : 0;
      const signo = dif >= 0 ? '+' : '−';
      return `
    <div class="sec">
      <h3>Zona · ${p.district}</h3>
      <div class="kv"><span>Promociones en cartera</span><b>${z.promociones}${
        r.de > 1 ? ` · ésta ${r.puesto}.ª de ${r.de} por ${L.short.toLowerCase()}` : ''}</b></div>
      <div class="kv"><span>Por etapa</span><b>${z.etapas.map(x => `${x.n} ${x.e.toLowerCase()}`).join(' · ')}</b></div>
      <div class="kv"><span>Inventario de la zona</span><b>${z.disponibles} de ${z.uds} sin vender</b></div>
      <div class="kv"><span>Absorción de la zona</span><b>${pc(z.absorcion)}</b></div>
      <div class="kv"><span>Precio medio de la zona</span><b>${$(z.ppm2)} /m²</b></div>
      ${z.promociones > 1 ? `<div class="kv"><span>Esta promoción</span><b>${$(g.avgPpm2)} /m² · ${signo}${(Math.abs(dif)*100).toFixed(1)} % vs la zona</b></div>` : ''}
      <div class="kv"><span>Valor en desarrollo</span><b>${M(z.gdv)}</b></div>
      <div class="kv"><span>Stock construido</span><b>${z.stock} edificios${
        z.stock ? ` · ${z.plantasMedia.toFixed(0)} plantas de media, ${z.plantasMax} el mayor` : ''}</b></div>
      <div class="ctxnote" style="margin-top:10px">
        <i style="background:var(--m3)"></i>Cartera y absorción salen de las promociones propias del
        distrito. El stock construido son huellas reales de OpenStreetMap sin modelo financiero:
        pincha una para estimarla.
      </div>
    </div>`
}

function renderDetail(){
  const p = cur, g = feas(p), L = lens();
  const s = scoreOf(p.id);
  const floors = [];
  for(let f=p.floors; f>=1; f--) floors.push(p.units.filter(u=>u.floor===f));

  const sales = {}; p.units.forEach(u=>{ if(u.month!=null) sales[u.month] = (sales[u.month]||0)+1 });
  const maxSale = Math.max(1, ...Object.values(sales));
  const bars = Array.from({length:Math.max(6,p.age+1)},(_,i)=>sales[i]||0);

  const remaining = p.units.filter(u=>u.status!=='sold')
    .sort((a,b)=>b.price-a.price).slice(0,6);

  /* Cada modo enseña lo suyo, y ésa es la diferencia que los hace útiles.
     En estudio de mercado la zona y los comparables van delante y desaparecen
     las tres secciones de operación —reparto de unidades, ventas por mes,
     inventario disponible—, que contestan «cómo va la venta de ésta» y no «cómo
     está el mercado aquí». Con todo junto el panel eran nueve secciones de
     scroll y ninguna pregunta contestada del tirón. */
  const bloqueZona = zonaHTML(p, g, L);

  el('detailBody').innerHTML = `
    ${modo === 'estudio' ? bloqueZona + mercadoHTML(p) : ''}
    <div class="sec">
      <div class="tiles">
        <div class="tile hero">
          <small>${p.estimated?'Modelo estimado':'Activo en cartera'}${s?` · puesto ${s.rank} de ${DATA.length}`:''}</small>
          <b>${p.name}</b>
          <div class="sub">${p.district} · ${p.floors} plantas · ${g.n} unidades</div>
        </div>
        <div class="tile"><small>${L.short}</small><b>${L.fmt(L.get(g))}</b></div>
        <div class="tile"><small>Utilidad</small><b>${M(g.profit)}</b></div>
      </div>
      <div class="kv"><span>Ingresos por venta</span><b>${M(g.gdv)}</b></div>
      <div class="kv"><span>Costo total</span><b>${M(g.cost)}</b></div>
      <div class="kv"><span>Margen sobre ingresos</span><b>${pc(g.margin)}</b></div>
      <div class="kv"><span>Contratado a la fecha</span><b>${M(g.contracted)}</b></div>
      <div class="kv"><span>Precio medio / m²</span><b>${$(g.avgPpm2)}</b></div>
      <div class="kv"><span>Punto de equilibrio</span><b>${g.beUnits} de ${g.n} unidades</b></div>
      <div class="kv"><span>Cierre de ventas</span><b>quedan ${g.monthsOut.toFixed(0)} meses</b></div>
    </div>

    ${modo === 'estudio' ? '' : bloqueZona}

    ${modo === 'estudio' ? '' : `
    <div class="sec">
      <h3>Reparto de unidades · ${pc(g.absorbed)} absorbido</h3>
      <div class="stack">
        ${floors.map(row=>`<div class="floor"><em>${row[0]?.floor ?? ''}</em>${
          row.map(u=>`<i title="${u.id} · ${u.type} · ${$(u.price)} · ${u.status}"
                        style="background:var(--${u.status==='sold'?'sold':u.status==='reserved'?'resv':'avail'})"></i>`).join('')
        }</div>`).join('')}
      </div>
      <div class="keys">
        <div><i style="background:var(--sold)"></i>Vendidas ${g.sold}</div>
        <div><i style="background:var(--resv)"></i>Reservadas ${g.resv}</div>
        <div><i style="background:var(--avail)"></i>Disponibles ${g.remaining}</div>
      </div>
    </div>

    <div class="sec">
      <h3>Ventas por mes desde el lanzamiento</h3>
      <div class="bars">${bars.map(v=>`<i style="height:${Math.max(2,(v/maxSale)*100)}%"></i>`).join('')}</div>
      <div class="axis"><span>lanzamiento</span><span>${bars.length} meses</span></div>
    </div>

    <div class="sec">
      <h3>Inventario disponible destacado</h3>
      <table>
        <thead><tr><th>Unidad</th><th>Tipo</th><th>Precio</th><th>Estado</th></tr></thead>
        <tbody>${remaining.map(u=>`<tr><td>${u.id}</td><td>${u.type}</td><td>${$(u.price)}</td>
          <td>${u.status==='reserved'?'Reserv.':'Disp.'}</td></tr>`).join('')}</tbody>
      </table>
    </div>`}`;

  enlazarComparables();
}

/* ---- search ---- */
const q = el('q'), qRes = el('qRes');
let matches = [], activeIdx = -1;

function search(term){
  const t = term.trim().toLowerCase();
  if(!t){ matches = []; qRes.classList.remove('open'); el('qClear').style.display='none'; return }
  el('qClear').style.display='block';
  const L = lens();
  matches = scored
    .filter(s => s.p.name.toLowerCase().includes(t) || s.p.district.toLowerCase().includes(t))
    .slice(0,8)
    .map(s => ({kind:'project', s}));

  /* also search the city buildings currently drawn on screen */
  if(mapReady && map.getLayer('building-3d')){
    const seen = new Set();
    const ctx = map.queryRenderedFeatures({layers:['building-3d']})
      .filter(f=>{
        const n = f.properties?.name || f.properties?.['name:en'];
        if(!n || !n.toLowerCase().includes(t) || seen.has(n)) return false;
        seen.add(n); return true;
      }).slice(0,5);
    ctx.forEach(f=>matches.push({kind:'context', f}));
  }

  activeIdx = matches.length ? 0 : -1;
  qRes.innerHTML = matches.length ? renderMatches(L) : `<div class="empty">No building matches “${term}”.</div>`;
  qRes.classList.add('open');
  qRes.querySelectorAll('li').forEach((li,i)=>{
    li.onmouseenter = ()=>{ activeIdx=i; markActive() };
    li.onclick = ()=>choose(i);
  });
}
function renderMatches(L){
  const proj = matches.filter(m=>m.kind==='project'), ctx = matches.filter(m=>m.kind==='context');
  let html = '';
  if(proj.length){
    html += `<div class="grouphead">Cartera</div><ul>` + proj.map((m,i)=>{
      const idx = matches.indexOf(m);
      return `<li data-i="${idx}" class="${idx===activeIdx?'active':''}">
        <i class="sw" style="background:${rampColor(m.s.score)}"></i>
        <div><b>${m.s.p.name}</b><small>${m.s.p.district} · rank ${m.s.rank}</small></div>
        <span class="val">${L.fmt(m.s.v)}</span></li>`;
    }).join('') + `</ul>`;
  }
  if(ctx.length){
    html += `<div class="grouphead">En el mapa</div><ul>` + ctx.map(m=>{
      const idx = matches.indexOf(m);
      const n = m.f.properties?.name || m.f.properties?.['name:en'];
      return `<li data-i="${idx}" class="${idx===activeIdx?'active':''}">
        <i class="sw" style="background:var(--ctx-hi)"></i>
        <div><b>${n}</b><small>Stock construido de la zona</small></div></li>`;
    }).join('') + `</ul>`;
  }
  return html;
}
function markActive(){
  qRes.querySelectorAll('li').forEach(li=>li.classList.toggle('active', +li.dataset.i===activeIdx));
}
function centroid(geom){
  const ring = geom.type==='Polygon' ? geom.coordinates[0] : geom.coordinates[0][0];
  let x=0,y=0; ring.forEach(([a,b])=>{x+=a;y+=b});
  return {lng:x/ring.length, lat:y/ring.length};
}
function choose(i){
  const m = matches[i]; if(!m) return;
  closeSearch();
  if(m.kind==='project'){ select(m.s.p) }
  else {
    /* Un edificio de contexto se puede buscar y volar hasta él —es útil para
       situarse— pero ya no se abre en ficha: no tiene modelo detrás. */
    const c = centroid(m.f.geometry);
    map.flyTo({center:[c.lng,c.lat], zoom:16.4, pitch:62, duration:900});
    toast('Stock construido · sin modelo financiero detrás');
  }
}
function closeSearch(){ qRes.classList.remove('open'); q.blur() }

q.addEventListener('input', e=>search(e.target.value));
q.addEventListener('focus', ()=>{ if(q.value.trim()) search(q.value) });
q.addEventListener('keydown', e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); activeIdx=Math.min(matches.length-1,activeIdx+1); markActive() }
  else if(e.key==='ArrowUp'){ e.preventDefault(); activeIdx=Math.max(0,activeIdx-1); markActive() }
  else if(e.key==='Enter'){ e.preventDefault(); choose(activeIdx) }
  else if(e.key==='Escape'){ closeSearch() }
});
el('qClear').onclick = ()=>{ q.value=''; search(''); q.focus() };
document.addEventListener('click', e=>{ if(!e.target.closest('.search')) qRes.classList.remove('open') });
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key==='k'){ e.preventDefault(); q.focus(); q.select() }
});

  const t = el('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2400);
}

};

/* ---- areas ---- */
/* areas are derived from where the buildings actually are — no hand-typed centres */
const AREAS = {overview:{center:CENTER, zoom:13.6, pitch:40, label:'Toda la ciudad'}};
[...new Set(DATA.map(p=>p.district))].sort((a,b)=>a.localeCompare(b,'es')).forEach(d=>{
  const ps = DATA.filter(p=>p.district===d);
  const lng = ps.reduce((a,p)=>a+p.lng,0)/ps.length, lat = ps.reduce((a,p)=>a+p.lat,0)/ps.length;
  const spread = Math.max(...ps.map(p=>Math.hypot((p.lat-lat)*111320,(p.lng-lng)*110000)), 120);
  AREAS[d] = {center:[lng,lat], zoom: Math.max(14.2, Math.min(16.4, 16.6 - Math.log2(spread/120))),
              label:`${d} · ${ps.length}`};
});
el('area').innerHTML = Object.entries(AREAS)
  .map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');
el('area').onchange = e=>{
  const a = AREAS[e.target.value];
  map.flyTo({center:a.center, zoom:a.zoom, pitch:a.pitch ?? 60, bearing:-18, duration:950});
};
/* El conmutador. Cambiar de modo no mueve el mapa ni pierde la selección: sólo
   cambia qué se puede pulsar y qué se enseña a la izquierda. */
function ponerModo(m){
  if(modo === m) return;
  modo = m;
  el('modoCartera').classList.toggle('on', m === 'cartera');
  el('modoEstudio').classList.toggle('on', m === 'estudio');
  document.body.classList.toggle('estudio', m === 'estudio');
  map.getCanvas().style.cursor = '';
  renderRank(); renderDetail();
  toast(m === 'estudio'
    ? 'Estudio de mercado · pincha cualquier edificio para estimarlo'
    : 'Cartera · sólo se pueden pulsar tus promociones');
}
el('modoCartera').onclick = ()=>ponerModo('cartera');
el('modoEstudio').onclick = ()=>ponerModo('estudio');

el('fitAll').onclick = ()=>{ el('area').value='overview'; map.flyTo({...AREAS.overview, bearing:-18, duration:950}) };
el('tilt').onclick = e=>{
  const to2D = map.getPitch() > 20;
  map.easeTo({pitch:to2D?0:60, bearing:to2D?0:-20, duration:700});
  e.currentTarget.textContent = to2D ? '3D view' : '2D view';
};
el('zoomIn').onclick  = ()=>map.zoomIn({duration:300});
el('zoomOut').onclick = ()=>map.zoomOut({duration:300});
el('north').onclick   = ()=>map.easeTo({bearing:0, duration:500});

/* ---- panels ---- */
function showRight(){ el('rightPanel').classList.remove('hidden'); el('showRight').classList.remove('on') }
el('closeLeft').onclick  = ()=>{ el('leftPanel').classList.add('hidden'); el('showLeft').classList.add('on') };
el('showLeft').onclick   = ()=>{ el('leftPanel').classList.remove('hidden'); el('showLeft').classList.remove('on') };
el('closeRight').onclick = ()=>{ el('rightPanel').classList.add('hidden'); el('showRight').classList.add('on') };
el('showRight').onclick  = showRight;

/* ---- theme ---- */
const saved = localStorage.getItem('ed-theme');
document.documentElement.dataset.theme = saved || 'light';
function syncTheme(){ el('theme').textContent = isDark() ? 'Light' : 'Dark' }
el('theme').onclick = ()=>{
  document.documentElement.dataset.theme = isDark() ? 'light' : 'dark';
  localStorage.setItem('ed-theme', document.documentElement.dataset.theme);
  syncTheme(); refreshMap(); renderRank(); renderDetail(); renderLegend();
};
syncTheme();

/* ---- boot ---- */
rescore();
renderRank();
renderDetail();
renderLegend();
/* La ficha arranca cerrada: con las dos columnas abiertas de salida, el mapa
   quedaba enterrado. Se abre sola al elegir un edificio (select → showRight). */
el('rightPanel').classList.add('hidden');
el('showRight').classList.add('on');
</script>
</body>
</html>
